<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>群聊 · 交互原型</title>
<style>
  :root{
    --bg:#1b1b1f; --bg2:#23232a; --bg3:#141417;
    --border:rgba(255,255,255,.12); --border2:rgba(255,255,255,.2);
    --text:#e6e6e9; --muted:#8a8a93; --dim:#6c6c75;
    --accent:#4c8dff; --danger:#e5484d;
    --r:8px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg3); color:var(--text);
    font:12px/1.6 system-ui,"Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column;
  }
  /* ---------- 页面工具条（原型专用，不进插件） ---------- */
  .toolbar{
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    border-bottom:1px solid var(--border); background:#101013; flex:none;
  }
  .toolbar b{font-size:12px;font-weight:600}
  .toolbar .hint{color:var(--dim);font-size:11px}
  .toolbar .sp{flex:1}
  .stage{flex:1;min-height:0;display:flex;justify-content:center;padding:14px;overflow:hidden}
  /* ---------- 面板 ---------- */
  .panel{
    width:900px; max-width:100%; height:100%;
    display:grid; grid-template-columns:248px minmax(0,1fr);
    background:var(--bg); border:1px solid var(--border); border-radius:12px; overflow:hidden;
    transition:width .18s ease;
  }
  .panel.narrow{width:380px;grid-template-columns:minmax(0,1fr)}
  .panel.narrow .room{display:none}
  .panel.narrow.room-open .room{display:flex}
  .panel.narrow.room-open .list{display:none}
  .panel.narrow .back{display:inline-flex}

  /* ---------- 左栏 ---------- */
  .list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border)}
  .list-head{display:flex;align-items:center;gap:8px;padding:12px 14px;flex:none}
  .list-head b{font-size:13px;flex:1}
  .search{margin:0 12px 8px;flex:none}
  .groups{flex:1;overflow-y:auto;padding:0 8px 8px}
  .group-wrap{position:relative}
  .group-wrap .del{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border:0;border-radius:6px;background:transparent;
    color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:12px;opacity:.28;transition:opacity .12s;
  }
  .group-wrap:hover .del,.group-wrap .del:focus-visible{opacity:1}
  .group[aria-current="true"] ~ .del{opacity:.5}
  .group-wrap .del:hover{background:rgba(255,255,255,.1);color:var(--danger)}
  .group{
    display:block;width:100%;text-align:left;position:relative;
    padding:9px 10px 9px 12px;border:0;border-radius:var(--r);
    background:transparent;color:inherit;font:inherit;cursor:pointer;margin-bottom:2px;
  }
  .group:hover{background:rgba(255,255,255,.04)}
  .group:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .group[aria-current="true"]{background:var(--bg2)}
  .group[aria-current="true"]::before{
    content:"";position:absolute;left:4px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent);
  }
  .group .gname{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
  .group .gmeta{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{
    margin-left:auto;min-width:16px;height:16px;padding:0 5px;border-radius:8px;
    background:var(--accent);color:#fff;font-size:10px;line-height:16px;text-align:center;flex:none;
  }
  .list-foot{flex:none;padding:10px 14px;border-top:1px solid var(--border);color:var(--dim);font-size:11px}

  /* ---------- 右栏 ---------- */
  .room{display:flex;flex-direction:column;min-height:0;min-width:0;flex:1}
  .room-wrap{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;height:100%}

  /* 弹窗样式见文件下方的“弹窗”区块 */
  .room-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex:none}
  .room-head .title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .room-head .count{color:var(--muted);font-size:12px;flex:none}
  .back{display:none;align-items:center;justify-content:center;width:26px;height:26px;flex:none}

  .members{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.06);flex:none}
  .chip{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:11px;
    border:1px solid var(--border2);background:transparent;color:inherit;font:inherit;
    font-size:11px;cursor:pointer;
  }
  .chip:hover{border-color:var(--accent)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .ch{color:var(--muted);font-size:10px}
  .chip[aria-pressed="true"] .ch{color:rgba(255,255,255,.8)}
  .chip .dot{
    flex:none;width:6px;height:6px;border-radius:50%;background:var(--muted);
  }
  /* 渠道色点：chip 与 @ 列表共用 */
  .dot[data-ch="codex"]{background:#f5a524}
  .dot[data-ch="claude"]{background:#d97757}
  .dot[data-ch="dsh"]{background:#4c8dff}
  .chip .dot[data-bound="1"]{box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
  .chip[aria-pressed="true"] .dot{background:#fff;box-shadow:none}
  .mention-item .dot{flex:none;width:6px;height:6px;border-radius:50%}

  .scroll{position:relative;flex:1;min-height:0}
  .messages{height:100%;overflow-y:auto;padding:14px}
  .m{margin-bottom:14px}
  .m .who{font-size:11px;color:var(--muted);margin-bottom:2px}
  .m .who .tag{color:var(--dim);margin-left:5px}
  .m .body{white-space:pre-wrap;word-break:break-word}
  .m.error .body{color:var(--danger)}
  .m.live .body{color:var(--muted)}
  .caret{display:inline-block;width:6px;height:12px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .empty{padding:24px 16px;color:var(--muted);text-align:center}
  .jump{
    position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    padding:4px 12px;border-radius:13px;background:var(--bg2);border:1px solid var(--border2);
    color:var(--text);font-size:11px;cursor:pointer;
  }

  .foot{flex:none;border-top:1px solid var(--border);padding:10px 14px}
  .busy{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--muted);font-size:11px}
  .composer{display:flex;gap:8px;align-items:flex-end;position:relative}

  /* @ 提及弹层 */
  .mention-pop{
    position:absolute;bottom:calc(100% + 8px);left:0;right:0;z-index:20;
    padding:4px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
    background:#2a2a31;box-shadow:0 12px 32px rgba(0,0,0,.5);
    max-height:200px;overflow-y:auto;
  }
  .mention-pop[hidden]{display:none}
  .mention-item{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:7px 10px;border:0;border-radius:7px;background:transparent;
    color:var(--text);font:inherit;font-size:12px;text-align:left;cursor:pointer;
  }
  .mention-item:hover,.mention-item[data-active="true"]{background:rgba(255,255,255,.08)}
  .mention-item .dot{flex:none;width:6px;height:6px;border-radius:50%}
  .mention-item .hint{margin-left:auto;color:var(--dim);font-size:10px}
  .mention-empty{padding:8px 10px;color:var(--dim);font-size:11px}
  textarea{
    flex:1;min-height:56px;max-height:120px;resize:none;padding:8px 10px;border-radius:var(--r);
    border:1px solid rgba(255,255,255,.16);background:transparent;color:inherit;font:inherit;
  }
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  textarea:disabled{opacity:.5;cursor:not-allowed}
  .reason{margin-top:5px;color:var(--dim);font-size:11px}
  .reason.warn{color:#d8a657}

  /* ---------- 通用控件 ---------- */
  button{font:inherit}
  .btn{
    height:32px;padding:0 12px;border-radius:6px;cursor:pointer;
    border:1px solid var(--border2);background:transparent;color:inherit;font-size:12px;white-space:nowrap;
  }
  .btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.icon{width:28px;padding:0;justify-content:center}
  input[type="text"],select{
    height:32px;padding:0 10px;border-radius:6px;border:1px solid rgba(255,255,255,.16);
    background:transparent;color:inherit;font:inherit;
  }
  input[type="text"]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .row{display:flex;gap:6px;align-items:center;padding:8px 14px}
  .row.wrap{flex-wrap:wrap}
  .form{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
  .form .line{display:flex;gap:6px}
  .err{color:var(--danger);font-size:11px;padding:0 14px 8px}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
  .center h3{margin:0;font-size:14px}
  .center p{margin:0;color:var(--muted);max-width:320px}
  .menu{
    position:absolute;right:14px;top:44px;z-index:20;min-width:140px;padding:4px;
    background:var(--bg2);border:1px solid var(--border2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .menu button{
    display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-radius:6px;
    background:transparent;color:inherit;font:inherit;cursor:pointer;
  }
  .menu button:hover{background:rgba(255,255,255,.06)}
  .menu button.danger{color:var(--danger)}
  .room-wrap{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}

  /* ---------- 弹窗 ---------- */
  .backdrop{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);
    backdrop-filter:blur(1px);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .dialog{
    width:368px;max-width:100%;background:var(--bg);color:var(--text);
    border:1px solid rgba(255,255,255,.14);border-radius:14px;
    box-shadow:0 24px 64px rgba(0,0,0,.6);overflow:hidden;
  }
  .dialog-head{
    display:flex;align-items:center;gap:8px;padding:14px 16px 10px;
  }
  .dialog-head h3{margin:0;font-size:14px;font-weight:600;flex:1}
  .dialog-head .x{
    width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;
    border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;
  }
  .dialog-head .x:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .dialog-body{padding:0 16px 14px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field > label{font-size:11px;color:var(--muted)}
  .field .hint{font-size:11px;color:var(--dim);line-height:1.5}
  .dialog-foot{
    display:flex;gap:8px;justify-content:flex-end;
    padding:12px 16px;border-top:1px solid var(--border);background:rgba(255,255,255,.02);
  }
  .dialog input[type="text"]{height:34px;border-radius:8px}
  .dialog .btn{height:34px}
  .dialog .btn.primary{min-width:96px}
  .dialog .btn.primary:disabled{background:var(--bg2);border-color:var(--border2);color:var(--muted);opacity:1}
  .btn.danger{color:var(--danger);border-color:rgba(229,72,77,.5)}
  .btn.danger:hover:not(:disabled){background:rgba(229,72,77,.12);border-color:var(--danger);color:var(--danger)}
  .dialog .err{padding:0 0 10px}

  /* ---------- 自绘下拉（替代原生 select） ---------- */
  .select{position:relative}
  .select-trigger{
    width:100%;height:34px;display:flex;align-items:center;gap:8px;
    padding:0 10px;border-radius:8px;border:1px solid rgba(255,255,255,.16);
    background:transparent;color:var(--text);font:inherit;font-size:12px;cursor:pointer;text-align:left;
  }
  .select-trigger:hover{border-color:rgba(255,255,255,.3)}
  .select-trigger:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .select-trigger[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .select-trigger .val{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .select-trigger .caret{
    flex:none;width:7px;height:7px;margin-right:3px;
    background:none;animation:none;                     /* 别继承流式光标 .caret 的样式 */
    border-top:1.5px solid var(--muted);border-right:1.5px solid var(--muted);
    transform:rotate(135deg) translate(-1px,-1px);
  }
  .select-menu{
    position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:10;
    padding:4px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
    background:#2a2a31;box-shadow:0 12px 32px rgba(0,0,0,.5);
    max-height:220px;overflow-y:auto;
  }
  .select-option{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:7px 10px;border:0;border-radius:7px;background:transparent;
    color:var(--text);font:inherit;font-size:12px;text-align:left;cursor:pointer;
  }
  .select-option:hover,.select-option[data-active="true"]{background:rgba(255,255,255,.08)}
  .select-option[aria-selected="true"]{color:var(--accent)}
  .select-option[aria-selected="true"]::after{content:"✓";margin-left:auto;font-size:11px}
  .select-option .sub{color:var(--dim);font-size:11px;margin-left:auto}

  /* 会话选择器 */
  .picker{margin-top:6px;border:1px solid var(--border2);border-radius:8px;max-height:152px;overflow-y:auto}
  .picker-item{
    display:flex;flex-direction:column;gap:1px;width:100%;padding:7px 10px;
    border:0;border-bottom:1px solid rgba(255,255,255,.06);background:transparent;
    color:inherit;font:inherit;text-align:left;cursor:pointer;
  }
  .picker-item:last-child{border-bottom:0}
  .picker-item:hover{background:rgba(255,255,255,.06)}
  .picker-item .t{font-size:12px}
  .picker-item .s{font-size:10px;color:var(--dim)}

  /* 接管方式 */
  .seg{display:flex;gap:6px}
  .seg button{
    flex:1;height:30px;border-radius:7px;border:1px solid var(--border2);
    background:transparent;color:var(--muted);font:inherit;font-size:11px;cursor:pointer;
  }
  .seg button:hover{border-color:rgba(255,255,255,.3)}
  .seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(76,141,255,.12)}
  .field.invalid input{border-color:var(--danger)}
</style>
</head>
<body>

<div class="toolbar">
  <b>群聊 · 交互原型</b>
  <span class="hint">点群切换、点成员定向、发消息看模拟回复</span>
  <span class="sp"></span>
  <button class="btn" id="widthBtn">窄宽度预览</button>
  <button class="btn" id="resetBtn">重置数据</button>
</div>

<div class="stage">
  <div class="panel" id="panel">
    <aside class="list">
      <div class="list-head">
        <b>群聊</b>
        <button class="btn icon" id="newGroupBtn" title="新建群" aria-label="新建群">+</button>
      </div>
      <div class="search"><input type="text" id="search" placeholder="搜索群聊…" style="width:100%" aria-label="搜索群聊"></div>
      <div class="groups" id="groups"></div>
      <div class="list-foot" id="listFoot"></div>
    </aside>

    <div class="room-wrap">
      <section class="room" id="room" aria-live="polite"></section>
    </div>
  </div>
</div>

<div id="modal-root"></div>

<script>
(() => {
  const CHANNELS = ['codex', 'claude', 'dsh'];
  const TEMPLATES = [
    { value: '', label: '不预置成员' },
    { value: 'dev', label: '开发（架构/实现/审校）' },
    { value: 'review', label: '评审（主审/复核）' },
    { value: 'research', label: '调研（调研/收敛）' },
  ];
  const ROSTERS = {
    dev: [['codex','架构师'],['claude','实现'],['dsh','审校']],
    review: [['claude','主审'],['dsh','复核']],
    research: [['dsh','调研'],['codex','收敛']],
  };

  let seq = 0;
  const mk = (name, members, messages) => ({ id:'g'+(++seq), name, members, messages, unread:0, at:Date.now() });
  const member = (name, channel, hasThread=true) => ({ id:'m'+(++seq), name, channel, hasThread });
  const msg = (author, channel, text, ms=null, kind='message') => ({ id:'x'+(++seq), author, channel, text, ms, kind, at:Date.now() });

  function seed(){
    return [
      mk('P1 验收群',
        [member('Codex-架构师','codex'), member('Claude-审校','claude')],
        [
          msg('你', null, '记住这个数字：7412。只回复 OK，不要解释。'),
          msg('Codex-架构师','codex','OK', 123000),
          msg('Claude-审校','claude','结论：本轮消息与我的审校角色冲突，不能只回 OK。作为审校，我指出：这是连通性验收中的指令性重复消息，不应按业务指令执行记忆任务。', 8000),
          msg('你', null, '连通性验收第二步：我刚才让你记住的数字是多少？只回答数字本身。'),
          msg('Codex-架构师','codex','7412', 122000),
          msg('Claude-审校','claude','结论：我没有记住该数字，因为上轮我未按指令执行记忆任务；作为审校，我指出该提问与我的角色定位不符，无法只回数字。', 5000),
        ]),
      mk('P3 导入验收',
        [member('十月接管','codex'), member('十月接管-fork','codex'), member('DSH-主持','dsh',false), member('Claude-接管','claude')],
        [msg('你', null, '一句话说明：上次涉及哪一笔收款？'),
         msg('十月接管-fork','codex','作为财务流程分析师，上次分析《认款流程》时重点核对的是 BYDINERAL 的 USD 7,539.00 收款，对应订单 A012026101301。', 150000)]),
      mk('模板验收群',
        [member('主审','claude'), member('复核','dsh',false), member('调研B','dsh',false)],
        [msg('你', null,'变量命名为什么要具体？'),
         msg('复核','dsh','变量命名要具体，是为了让代码含义无需猜测，减少误读和维护成本。无异议。', 987)]),
    ];
  }

  const state = {
    groups: seed(),
    activeId: null,
    query: '',
    targets: new Set(),
    draft: '',
    mentions: new Set(),   // 通过 @ 提到的成员 id
    mention: null,         // {start, query, index} —— @ 弹层状态
    busy: null,          // {names:[], cancelled:false}
    live: null,          // {name, channel, text, ms, streaming}
    removing: null,      // 待确认移除的群 id
    adding: null,        // {channel, name, role, sid, mode}
    openSelect: null,    // 'channel' | 'template' | null
    sessionPicker: false,
    focusModal: false,
    creating: false,
    newName: '',
    newTemplate: '',
    error: null,
    narrow: false,
    roomOpen: false,
    menuOpen: false,
    atBottom: true,
    hasNew: false,
  };
  state.activeId = state.groups[0].id;

  const $ = (id) => document.getElementById(id);
  const groupsEl = $('groups'), roomEl = $('room'), footEl = $('listFoot');
  const active = () => state.groups.find(g => g.id === state.activeId) || null;
  const targetsOf = () => {
    const g = active(); if (!g) return [];
    return g.members.filter(m => state.targets.has(m.id));
  };
  const fmtMs = (ms) => ms == null ? '' : (ms >= 1000 ? Math.round(ms/1000) + 's' : ms + 'ms');

  /* ---------------- 左栏 ---------------- */
  function renderGroups(){
    const q = state.query.trim().toLowerCase();
    const list = state.groups.filter(g => !q || g.name.toLowerCase().includes(q));
    footEl.textContent = state.groups.length + ' 个群';
    if (!list.length){
      groupsEl.innerHTML = '<div class="empty">' + (q ? '没有匹配的群' : '还没有群，点右上角 + 新建') + '</div>';
      return;
    }
    groupsEl.innerHTML = list.map(g => {
      const last = g.messages[g.messages.length - 1];
      const meta = `${g.members.length} 人` + (last ? ` · ${last.channel ? last.author + ' ' : ''}${last.channel ? fmtMs(last.ms) : last.text.slice(0,12)}` : '');
      return `<div class="group-wrap">
        <button class="group" data-gid="${g.id}" aria-current="${g.id===state.activeId}" style="padding-right:34px">
          <div class="gname">${esc(g.name)}${g.unread ? `<span class="badge">${g.unread}</span>` : ''}</div>
          <div class="gmeta">${esc(meta)}</div>
        </button>
        <button class="del" data-del="${g.id}" title="移除群聊" aria-label="移除群聊 ${esc(g.name)}">✕</button>
      </div>`;
    }).join('');
  }

  /* ---------------- 右栏 ---------------- */
  function renderRoom(){
    const g = active();
    if (!g){
      roomEl.innerHTML = `<div class="center"><h3>群聊</h3><p>从左侧选一个群，或新建一个。</p></div>`;
      return;
    }
    if (!g.members.length){
      roomEl.innerHTML = `
        <div class="room-head"><div class="title">${esc(g.name)}</div><span class="count">· 0 人</span></div>
        <div class="center">
          <h3>群里还没有人</h3><p>加一个成员，就能开始发言。</p>
          <button class="btn primary" data-act="add-first" style="width:auto;min-width:180px">+ 加第一个成员</button>
        </div>`;
      return;
    }

    const head = `
      <div class="room-head">
        <button class="btn icon back" data-act="back" title="返回群列表" aria-label="返回群列表">←</button>
        <div class="title">${esc(g.name)}</div><span class="count">· ${g.members.length} 人</span>
        <span style="flex:1"></span>
        <button class="btn" data-act="add">+ 加成员</button>
        <button class="btn icon" data-act="menu" title="更多" aria-label="更多">⋯</button>
      </div>
      ${state.menuOpen ? `<div class="menu">
          <button data-act="export">导出纪要</button>
          <button data-act="rename">重命名</button>
          <button data-act="remove" class="danger">移除群聊</button>
        </div>` : ''}`;

    const chips = `<div class="members">` +
      g.members.map(m => `<button class="chip" data-mid="${m.id}" aria-pressed="${state.targets.has(m.id)}"
        title="${esc(m.name)} · ${esc(m.channel)}${m.hasThread ? ' · 已绑定会话' : ' · 新会话'}"
        aria-label="${esc(m.name)}（${esc(m.channel)}${m.hasThread ? '，已绑定会话' : ''}）">
        <span class="dot" data-ch="${esc(m.channel)}" data-bound="${m.hasThread ? '1' : '0'}"></span>${esc(m.name)}</button>`).join('') +
      (state.targets.size ? `<button class="btn" data-act="clear" style="height:26px;font-size:11px">清除选择</button>` : '') +
      `</div>`;

    const err = state.error ? `<div class="err">${esc(state.error)}</div>` : '';

    const body = g.messages.map(m => messageHtml(m)).join('') ||
      `<div class="empty">还没有消息，发第一句吧</div>`;
    const liveHtml = state.live ? `
      <div class="m live">
        <div class="who">${esc(state.live.name)}<span class="tag">${state.live.channel} · ${Math.round(state.live.ms/1000)}s · 输出中</span></div>
        <div class="body">${esc(state.live.text)}<span class="caret"></span></div>
      </div>` : '';

    const jump = (state.hasNew && !state.atBottom) ? `<button class="jump" data-act="jump">有新消息 · 回到底部</button>` : '';

    const busyRow = state.busy ? `<div class="busy">
        <span>等待成员回复…</span>
        <button class="btn" data-act="stop" style="height:24px;font-size:11px">停止回复</button>
      </div>` : '';

    const disabled = state.busy ? true : false;
    const picked = recipients();
    const who = picked.length === 0
      ? '发给全体成员…'
      : picked.length === 1
        ? `发给 ${picked[0].name}…`
        : `发给 ${picked.length} 位成员…`;
    const reason = state.busy
      ? '成员正在回复，稍等或点「停止回复」'
      : '输入 @ 可点名 · Enter 发送 · Shift+Enter 换行';

    const foot = `<div class="foot">
        ${err}
        ${busyRow}
        <div class="composer">
          <div class="mention-pop" id="mention-pop" hidden></div>
          <textarea id="draft" placeholder="${esc(who)}"
            ${disabled ? 'disabled' : ''}>${esc(state.draft)}</textarea>
          <button class="btn primary" data-act="send" style="height:56px;min-width:76px"
            ${(!state.draft.trim() || state.busy) ? 'disabled' : ''}>发送</button>
        </div>
        <div class="reason">${reason}</div>
      </div>`;

    roomEl.innerHTML = head + chips + `<div class="scroll"><div class="messages" id="msgs">${body}${liveHtml}</div>${jump}</div>` + foot;

    const msgs = $('msgs');
    if (msgs) {
      msgs.scrollTop = state.atBottom ? msgs.scrollHeight : msgs.scrollTop;
      msgs.onscroll = () => {
        const bottom = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 24;
        state.atBottom = bottom;
        if (bottom) state.hasNew = false;
        const j = roomEl.querySelector('.jump');
        if (j) j.style.display = (state.hasNew && !bottom) ? '' : 'none';
      };
    }
    const ta = $('draft');
    if (ta) {
      ta.oninput = (e) => {
        state.draft = e.target.value;
        syncSend();
        refreshMention(e.target);
      };
      ta.onkeydown = (e) => {
        if (state.mention){
          const list = mentionCandidates();
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
            e.preventDefault();
            if (!list.length) return;
            const step = e.key === 'ArrowDown' ? 1 : -1;
            state.mention.index = (state.mention.index + step + list.length) % list.length;
            paintMention();
            return;
          }
          if ((e.key === 'Enter' || e.key === 'Tab') && list.length){
            e.preventDefault();
            pickMention(list[state.mention.index] || list[0]);
            return;
          }
          if (e.key === 'Escape'){ e.preventDefault(); closeMention(); return; }
        }
        if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
      };
      ta.onblur = () => setTimeout(closeMention, 120);
      if (document.activeElement !== ta && state.focusDraft){ ta.focus(); state.focusDraft = false; }
    }
  }

  /* ---------------- @ 提及 ---------------- */
  function recipients(){
    const g = active(); if (!g) return [];
    const ids = new Set([...state.targets, ...state.mentions]);
    return ids.size ? g.members.filter(m => ids.has(m.id)) : [];
  }

  function mentionCandidates(){
    const g = active();
    if (!g || !state.mention) return [];
    const q = state.mention.query.toLowerCase();
    return g.members.filter(m => !q || m.name.toLowerCase().includes(q));
  }

  function refreshMention(ta){
    const pos = ta.selectionStart ?? ta.value.length;
    const before = ta.value.slice(0, pos);
    const m = /(^|[\s(])@([^\s@]{0,20})$/.exec(before);
    if (!m){ closeMention(); return; }
    const query = m[2];
    state.mention = { start: pos - query.length - 1, query, index: 0 };
    paintMention();
  }

  function closeMention(){
    state.mention = null;
    paintMention();
  }

  function paintMention(){
    const pop = $('mention-pop');
    if (!pop) return;
    if (!state.mention){ pop.hidden = true; pop.innerHTML = ''; return; }
    const list = mentionCandidates();
    pop.hidden = false;
    pop.innerHTML = list.length
      ? list.map((m, i) => `<button type="button" class="mention-item" data-mention="${m.id}" data-active="${i === state.mention.index}">
          <span class="dot" data-ch="${esc(m.channel)}"></span>${esc(m.name)}
          <span class="hint">${esc(m.channel)}${m.hasThread ? ' · 已绑定' : ''}</span>
        </button>`).join('')
      : `<div class="mention-empty">没有匹配的成员</div>`;
  }

  function pickMention(member){
    const ta = $('draft');
    if (!ta || !state.mention || !member) return;
    const start = state.mention.start;
    const pos = ta.selectionStart ?? ta.value.length;
    const insert = '@' + member.name + ' ';
    const value = ta.value.slice(0, start) + insert + ta.value.slice(pos);
    ta.value = value;
    state.draft = value;
    state.mentions.add(member.id);
    ta.selectionStart = ta.selectionEnd = start + insert.length;
    state.mention = null;
    paintMention();
    syncSend();
    updatePlaceholder(ta);
    ta.focus();
  }

  function updatePlaceholder(ta){
    const picked = recipients();
    ta.placeholder = picked.length === 0
      ? '发给全体成员…'
      : picked.length === 1
        ? `发给 ${picked[0].name}…`
        : `发给 ${picked.length} 位成员…`;
  }

  function messageHtml(m){
    const who = esc(m.author) + (m.channel ? `<span class="tag">${m.channel}${m.ms!=null?` · ${fmtMs(m.ms)}`:''}</span>` : '');
    return `<div class="m ${m.kind==='error'?'error':''}">
      <div class="who">${who}</div><div class="body">${esc(m.text)}</div></div>`;
  }

  function syncSend(){
    const btn = roomEl.querySelector('[data-act="send"]');
    if (btn) btn.disabled = !state.draft.trim() || !!state.busy;
  }
  function syncAddBtn(){
    const btn = document.querySelector('[data-act="add-confirm"]');
    if (btn) btn.disabled = !state.adding || !state.adding.name.trim();
  }

  /* ---------------- 行为 ---------------- */
  const REPLIES = [
    '结论：先明确边界，再谈实现；这一层不该承担鉴权。',
    '我补一个反例：如果并发上线，当前设计会在第二次提交时冲突。',
    '同意，但需要一条回滚路径，否则出错只能重建。',
    '这里建议拆成两次改动，先落数据再落接口。',
  ];

  function send(){
    const g = active(); if (!g || state.busy) return;
    const text = state.draft.trim(); if (!text) return;
    const picked = recipients();
    const list = picked.length ? picked : g.members;
    g.messages.push(msg('你', null, text));
    state.draft = ''; state.atBottom = true; state.mentions.clear(); state.mention = null;
    state.busy = { cancelled:false };
    renderGroups(); renderRoom();
    runReply(g, list, 0);
  }

  function runReply(g, list, index){
    if (!state.busy || state.busy.cancelled || index >= list.length){ finish(); return; }
    const m = list[index];
    const started = Date.now();
    state.live = { name:m.name, channel:m.channel, text:'', ms:0 };
    renderRoom();

    const full = REPLIES[(index + g.messages.length) % REPLIES.length];
    let i = 0;
    const tick = setInterval(() => {
      if (!state.busy || state.busy.cancelled || !state.live) { clearInterval(tick); return; }
      state.live.text = full.slice(0, ++i);
      state.live.ms = Date.now() - started;
      const box = $('msgs');
      if (box){ const live = box.querySelector('.m.live .body'); if (live) live.innerHTML = esc(state.live.text) + '<span class="caret"></span>'; }
      const who = box && box.querySelector('.m.live .tag');
      if (who) who.textContent = `${state.live.channel} · ${Math.round(state.live.ms/1000)}s · 输出中`;
    }, 24);

    setTimeout(() => {
      clearInterval(tick);
      if (!state.busy || state.busy.cancelled){ finish(); return; }
      const ms = Date.now() - started;
      g.messages.push(msg(m.name, m.channel, full, ms));
      g.at = Date.now();
      if (g.id !== state.activeId) g.unread++;
      state.live = null;
      renderGroups(); renderRoom();
      runReply(g, list, index + 1);
    }, Math.min(3600, 900 + full.length * 22));
  }

  function finish(){
    state.busy = null; state.live = null;
    renderGroups(); renderRoom();
  }

  function addMember(){
    const g = active(); if (!g || !state.adding) return;
    const name = state.adding.name.trim(); if (!name) return;
    const sid = (state.adding.sid || '').trim();
    if (sid && !sidValid(sid)) return;
    const m = member(name, state.adding.channel, Boolean(sid));
    if (sid) m.takeover = state.adding.mode || 'fork';
    g.members.push(m);
    state.adding = null; state.sessionPicker = false;
    renderModal(); renderRoom();
  }

  function removeGroup(){
    const id = state.removing;
    if (!id) return;
    state.groups = state.groups.filter(x => x.id !== id);
    if (state.activeId === id){
      state.activeId = state.groups[0]?.id || null;
      state.targets.clear(); state.mentions.clear(); state.mention = null;
      state.draft = ''; state.atBottom = true; state.hasNew = false;
    }
    state.removing = null;
    if (!state.groups.length){ state.roomOpen = false; }
    renderAll();
  }

  function createGroup(){
    const name = state.newName.trim(); if (!name) return;
    const roster = ROSTERS[state.newTemplate] || [];
    const g = mk(name, roster.map(([ch,n]) => member(n, ch)), []);
    state.groups.unshift(g);
    state.activeId = g.id;
    state.creating = false; state.newName = ''; state.newTemplate = '';
    state.atBottom = true;
    renderAll();
  }

  function renderAll(){
    const panel = $('panel');
    panel.classList.toggle('narrow', state.narrow);
    panel.classList.toggle('room-open', state.narrow && state.roomOpen);
    renderGroups(); renderRoom(); renderModal();
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act],[data-gid],[data-mid],[data-select],[data-select-key],[data-mention],[data-del]');
    if (!t) {
      if (state.menuOpen || state.openSelect){
        state.menuOpen = false; state.openSelect = null;
        renderRoom(); renderModal();
      }
      return;
    }

    // 移除群聊：列表行的 ✕
    if (t.dataset.del){
      state.removing = t.dataset.del;
      state.menuOpen = false;
      renderModal();
      return;
    }

    // @ 提及点选
    if (t.dataset.mention){
      const g = active();
      const m = g && g.members.find(x => x.id === t.dataset.mention);
      if (m) pickMention(m);
      return;
    }

    // 自绘下拉
    if (t.dataset.select){
      const key = t.dataset.select;
      state.openSelect = state.openSelect === key ? null : key;
      renderModal();
      return;
    }
    if (t.dataset.selectKey){
      const key = t.dataset.selectKey;
      const value = t.dataset.value;
      if (key === 'channel' && state.adding){
        state.adding.channel = value;
        state.adding.thread = null;
      }
      if (key === 'template') state.newTemplate = value;
      state.openSelect = null;
      renderModal();
      return;
    }

    if (t.dataset.gid){
      state.activeId = t.dataset.gid;
      state.targets.clear(); state.mentions.clear(); state.mention = null;
      state.error = null; state.draft = ''; state.atBottom = true; state.hasNew = false;
      const g = active(); if (g) g.unread = 0;
      if (state.narrow) state.roomOpen = true;
      renderAll(); return;
    }
    if (t.dataset.mid){
      const id = t.dataset.mid;
      state.targets.has(id) ? state.targets.delete(id) : state.targets.add(id);
      renderRoom(); return;
    }

    const act = t.dataset.act;
    if (act === 'send') send();
    if (act === 'stop'){ if (state.busy) state.busy.cancelled = true; finish(); }
    if (act === 'jump'){ state.atBottom = true; state.hasNew = false; const b = $('msgs'); if (b) b.scrollTop = b.scrollHeight; renderRoom(); }
    if (act === 'add' || act === 'add-first'){
      state.adding = { channel:'dsh', name:'', role:'', sid:'', mode: loadMode() };
      state.error = null; state.openSelect = null; state.sessionPicker = false; state.focusModal = true;
      renderModal();
    }
    if (act === 'add-cancel'){ state.adding = null; state.openSelect = null; state.sessionPicker = false; renderModal(); renderRoom(); }
    if (act === 'add-confirm') addMember();
    if (act === 'pick-session'){ state.sessionPicker = !state.sessionPicker; renderModal(); }
    if (act === 'pick-one'){
      state.adding.sid = t.dataset.value;
      if (!state.adding.name.trim()) state.adding.name = t.dataset.title || '接管会话';
      state.sessionPicker = false; state.openSelect = null;
      renderModal();
    }
    if (act === 'clear-sid'){ state.adding.sid = ''; renderModal(); }
    if (act === 'mode'){ state.adding.mode = t.dataset.value; saveMode(t.dataset.value); renderModal(); }
    if (act === 'clear'){ state.targets.clear(); renderRoom(); }
    if (act === 'back'){ state.roomOpen = false; renderRoom(); }
    if (act === 'menu'){ state.menuOpen = !state.menuOpen; renderRoom(); }
    if (act === 'create-cancel'){ state.creating = false; state.error = null; renderModal(); }
    if (act === 'create-confirm') createGroup();
    if (act === 'modal-backdrop' && e.target.classList.contains('backdrop')){
      state.creating = false; state.adding = null; state.removing = null; renderModal();
    }
    if (act === 'remove'){ state.removing = state.activeId; state.menuOpen = false; renderRoom(); renderModal(); }
    if (act === 'remove-cancel'){ state.removing = null; renderModal(); }
    if (act === 'remove-confirm') removeGroup();
    if (act === 'rename'){
      const g = active(); if (!g) return;
      const name = prompt('群名', g.name);
      if (name && name.trim()){ g.name = name.trim(); }
      state.menuOpen = false; renderAll();
    }
    if (act === 'export'){
      const g = active(); if (!g) return;
      const md = ['# ' + g.name + ' · 群聊纪要','',
        '- 成员：' + g.members.map(m => m.name + '（' + m.channel + '）').join('、'),'','---','',
        ...g.messages.map(m => `**${m.author}**${m.channel ? `（${m.channel}）` : ''}` + (m.ms!=null?` · ${fmtMs(m.ms)}`:'') + '\n\n' + m.text + '\n')
      ].join('\n');
      const url = URL.createObjectURL(new Blob([md], { type:'text/markdown' }));
      const a = document.createElement('a');
      a.href = url; a.download = g.name + '-纪要.md'; a.click();
      URL.revokeObjectURL(url);
      state.menuOpen = false; renderRoom();
    }
  });

  $('search').oninput = (e) => { state.query = e.target.value; renderGroups(); };
  $('newGroupBtn').onclick = () => {
    state.creating = true; state.error = null; state.openSelect = null;
    state.newName = ''; state.newTemplate = ''; state.focusModal = true;
    renderModal();
  };
  $('widthBtn').onclick = () => {
    state.narrow = !state.narrow;
    $('widthBtn').textContent = state.narrow ? '宽宽度预览' : '窄宽度预览';
    renderAll();
  };
  $('resetBtn').onclick = () => {
    state.groups = seed(); state.activeId = state.groups[0].id;
    state.targets.clear(); state.mentions.clear(); state.mention = null;
    state.draft=''; state.busy=null; state.live=null;
    state.adding=null; state.creating=false; state.error=null; state.menuOpen=false;
    state.roomOpen = false; state.atBottom = true; state.hasNew = false;
    renderAll();
  };

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (state.openSelect){ state.openSelect = null; renderModal(); return; }
    if (state.creating || state.adding || state.removing){
      state.creating = false; state.adding = null; state.removing = null; renderModal();
    }
  });

  /* ---------------- 弹窗 ----------------
     新建群 / 加成员都走弹窗；下拉是自绘的，因为原生 <option> 在暗色下是系统白底。 */
  const CHANNEL_OPTIONS = [
    { value: 'codex', label: 'codex', sub: '子进程 · 用你的 Codex 登录' },
    { value: 'claude', label: 'claude', sub: '子进程 · 用你的 Claude Code 登录' },
    { value: 'dsh', label: 'dsh', sub: '原生模型 · 最省钱' },
  ];

  /** 原型用的假会话列表（真实插件里来自 group_sessions）。 */
  const SAMPLE_SESSIONS = [
    { id: '01a17ccb-8320-7be3-8ecf-a3145326c8a4', title: '清楚这个旧异常', at: '2026-10-29' },
    { id: '01a1e2c8-cead-7fc2-a315-103c08b21f73', title: '7412 记忆测试', at: '2026-11-16' },
    { id: '583a8d70-f5ea-42e3-a57b-d91c7108d5cf', title: 'Claude 审校会话', at: '2026-11-16' },
  ];
  const sidValid = (sid) => /^[0-9a-f]{8}-[0-9a-f]{4}/i.test(sid.trim());

  /** 接管方式由用户选，并记住上次选择；首次使用给更安全的「分叉」。 */
  const MODE_KEY = 'gc.takeoverMode';
  function loadMode(){
    try {
      const v = localStorage.getItem(MODE_KEY);
      if (v === 'fork' || v === 'resume') return v;
    } catch { /* file:// 下可能不可用 */ }
    return 'fork';
  }
  function saveMode(v){
    try { localStorage.setItem(MODE_KEY, v); } catch { /* ignore */ }
  }

  function selectHtml(key, value, options){
    const open = state.openSelect === key;
    const current = options.find(o => o.value === value);
    return `
      <div class="select">
        <button type="button" class="select-trigger" data-select="${key}"
          aria-haspopup="listbox" aria-expanded="${open}">
          <span class="val">${esc(current ? current.label : value)}</span>
          <span class="caret" aria-hidden="true"></span>
        </button>
        ${open ? `<div class="select-menu" role="listbox">
          ${options.map(o => `
            <button type="button" class="select-option" role="option"
              data-select-key="${key}" data-value="${esc(o.value)}"
              aria-selected="${o.value === value}">
              <span>${esc(o.label)}</span>
              ${o.sub ? `<span class="sub">${esc(o.sub)}</span>` : ''}
            </button>`).join('')}
        </div>` : ''}
      </div>`;
  }

  function renderModal(){
    const root = $('modal-root');

    if (state.removing){
      const g = state.groups.find(x => x.id === state.removing);
      if (!g){ state.removing = null; root.innerHTML = ''; return; }
      root.innerHTML = `
        <div class="backdrop" data-act="modal-backdrop">
          <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
            <div class="dialog-head">
              <h3 id="dlg-title">移除群聊</h3>
              <button type="button" class="x" data-act="remove-cancel" aria-label="关闭">✕</button>
            </div>
            <div class="dialog-body">
              <p style="margin:0 0 6px;font-size:12px">确定移除「${esc(g.name)}」吗？</p>
              <span class="hint">会连同 ${g.messages.length} 条聊天记录一起删除，不可恢复。成员本身不受影响。</span>
            </div>
            <div class="dialog-foot">
              <button type="button" class="btn" data-act="remove-cancel">取消</button>
              <button type="button" class="btn danger" data-act="remove-confirm">移除</button>
            </div>
          </div>
        </div>`;
      return;
    }

    if (state.creating){
      root.innerHTML = `
        <div class="backdrop" data-act="modal-backdrop">
          <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
            <div class="dialog-head">
              <h3 id="dlg-title">新建群</h3>
              <button type="button" class="x" data-act="create-cancel" aria-label="关闭">✕</button>
            </div>
            <div class="dialog-body">
              <div class="field">
                <label for="ng-name">群名</label>
                <input type="text" id="ng-name" placeholder="例如：接口评审" value="${esc(state.newName)}">
              </div>
              <div class="field">
                <label>成员模板</label>
                ${selectHtml('template', state.newTemplate, TEMPLATES.map(t => ({ value: t.value, label: t.label })))}
                <span class="hint">选模板会自动配好成员；也可以先建空群。</span>
              </div>
            </div>
            <div class="dialog-foot">
              <button type="button" class="btn" data-act="create-cancel">取消</button>
              <button type="button" class="btn primary" data-act="create-confirm"
                ${state.newName.trim() ? '' : 'disabled'}>建群</button>
            </div>
          </div>
        </div>`;
      const nameIn = $('ng-name');
      nameIn.oninput = (e) => {
        state.newName = e.target.value;
        const btn = root.querySelector('[data-act="create-confirm"]');
        if (btn) btn.disabled = !e.target.value.trim();
      };
      nameIn.onkeydown = (e) => { if (e.key === 'Enter' && state.newName.trim()) createGroup(); };
      if (state.focusModal){ nameIn.focus(); nameIn.select(); state.focusModal = false; }
      return;
    }

    if (state.adding){
      const noThread = state.adding.channel === 'dsh';
      const sid = state.adding.sid || '';
      const mode = state.adding.mode || 'fork';
      const sidDirty = sid.trim() !== '';
      const sidBad = sidDirty && !sidValid(sid);
      const canSubmit = state.adding.name.trim() && !sidBad;
      root.innerHTML = `
        <div class="backdrop" data-act="modal-backdrop">
          <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
            <div class="dialog-head">
              <h3 id="dlg-title">加成员</h3>
              <button type="button" class="x" data-act="add-cancel" aria-label="关闭">✕</button>
            </div>
            <div class="dialog-body">
              <div class="field">
                <label>渠道</label>
                ${selectHtml('channel', state.adding.channel, CHANNEL_OPTIONS)}
              </div>
              <div class="field">
                <label for="f-name">名称</label>
                <input type="text" id="f-name" placeholder="例如：架构师" value="${esc(state.adding.name)}">
              </div>
              <div class="field">
                <label for="f-role">职责（可选）</label>
                <input type="text" id="f-role" placeholder="会写进它的提示词" value="${esc(state.adding.role)}">
              </div>

              <div class="field ${sidBad ? 'invalid' : ''}">
                <label for="f-sid">会话 ID（可选）</label>
                <input type="text" id="f-sid" spellcheck="false"
                  placeholder="留空 = 新建会话；填入则接管这条会话"
                  value="${esc(sid)}" ${noThread ? 'disabled' : ''}>
                <div style="display:flex;gap:6px">
                  <button type="button" class="btn" data-act="pick-session" style="flex:1"
                    ${noThread ? 'disabled' : ''}>
                    ${state.sessionPicker ? '收起列表' : '选已有会话…'}
                  </button>
                  ${sidDirty ? `<button type="button" class="btn" data-act="clear-sid" style="flex:0 0 auto">清空</button>` : ''}
                </div>
                ${state.sessionPicker && !noThread ? `<div class="picker">
                  ${SAMPLE_SESSIONS.map(s => `
                    <button type="button" class="picker-item" data-act="pick-one" data-value="${esc(s.id)}" data-title="${esc(s.title)}">
                      <span class="t">${esc(s.title)}</span>
                      <span class="s">${esc(s.id.slice(0, 8))}… · ${esc(s.at)}</span>
                    </button>`).join('')}
                </div>` : ''}
                ${noThread
                  ? `<span class="hint">dsh 成员没有外部会话，留空就会新建一个纯对话会话。</span>`
                  : sidBad
                    ? `<span class="hint" style="color:var(--danger)">看起来不是有效的会话 ID（UUID 形式）。</span>`
                    : sidDirty
                      ? `<span class="hint">添加后它会接着这条会话的上下文说话。</span>`
                      : `<span class="hint">不填就是新会话，从零开始。</span>`}
              </div>

              ${sidDirty && !sidBad ? `
              <div class="field" style="margin-bottom:4px">
                <label>接管方式（由你选，会记住）</label>
                <div class="seg">
                  <button type="button" data-act="mode" data-value="fork" aria-pressed="${mode === 'fork'}">分叉</button>
                  <button type="button" data-act="mode" data-value="resume" aria-pressed="${mode === 'resume'}">续写</button>
                </div>
                <span class="hint">${mode === 'fork'
                  ? '分叉：读得到旧上下文，新回合写在一条新线程里，你原来那条会话一字不改。'
                  : '续写：直接往原会话里追加消息。原会话正被 Codex 桌面端打开时会失败，也改写了原会话历史。'}</span>
              </div>` : ''}
            </div>
            <div class="dialog-foot">
              <button type="button" class="btn" data-act="add-cancel">取消</button>
              <button type="button" class="btn primary" data-act="add-confirm"
                ${canSubmit ? '' : 'disabled'}>${sidDirty && !sidBad ? '接管并添加' : '添加成员'}</button>
            </div>
          </div>
        </div>`;
      const nameIn = $('f-name');
      nameIn.oninput = (e) => {
        state.adding.name = e.target.value;
        const btn = root.querySelector('[data-act="add-confirm"]');
        if (btn) btn.disabled = !e.target.value.trim() || sidBad;
      };
      nameIn.onkeydown = (e) => { if (e.key === 'Enter' && state.adding.name.trim() && !sidBad) addMember(); };
      $('f-role').oninput = (e) => { state.adding.role = e.target.value; };

      const sidIn = $('f-sid');
      sidIn.oninput = (e) => {
        state.adding.sid = e.target.value;
        // 轻量：只在"是否为空"翻转时重绘（切换接管方式区块与按钮文案）
        const wasEmpty = sidDirty === false;
        if (wasEmpty !== (e.target.value.trim() === '')) renderModal();
      };
      sidIn.onkeydown = (e) => {
        if (e.key === 'Enter'){
          const v = e.target.value;
          if (v.trim() && !sidValid(v)) return;
          e.preventDefault();
          if (state.adding.name.trim()) addMember();
        }
      };

      if (state.focusModal){ nameIn.focus(); nameIn.select(); state.focusModal = false; }
      return;
    }

    root.innerHTML = '';
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // 便于截图与分享特定状态：?modal=create / ?modal=add / ?width=narrow
  const params = new URLSearchParams(location.search);
  if (params.get('modal') === 'create'){ state.creating = true; state.newName = '接口评审'; }
  if (params.get('modal') === 'add'){ state.adding = { channel:'codex', name:'架构师', role:'负责架构与取舍', sid:'', mode: loadMode() }; }
  if (params.get('mode') === 'resume'){ state.adding = state.adding || { channel:'codex', name:'接管-旧会话', role:'', sid:'', mode:'resume' }; state.adding.mode = 'resume'; }
  if (params.get('sid')){ state.adding = state.adding || { channel:'codex', name:'接管-旧会话', role:'', sid:'', mode:'fork' }; state.adding.sid = params.get('sid'); }
  if (params.get('picker') === '1'){ state.sessionPicker = true; }
  if (params.get('remove') === '1'){ state.removing = state.groups[0].id; }
  if (params.get('hover') === '1'){ /* 仅用于截图：悬停态由 CSS 驱动，这里无需处理 */ }
  if (params.get('select')){ state.openSelect = params.get('select'); }
  if (params.get('width') === 'narrow'){ state.narrow = true; state.roomOpen = true; $('widthBtn').textContent = '宽宽度预览'; }

  renderAll();

  // 便于截图：?at=1 预先打出 @ 并展开提及列表
  if (params.get('at') === '1'){
    state.draft = '@';
    renderRoom();
    const ta = $('draft');
    if (ta){
      ta.value = '@';
      ta.setSelectionRange(1, 1);
      ta.focus();
      refreshMention(ta);
    }
  }
})();
</script>
</body>
</html>
